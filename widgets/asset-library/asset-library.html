<div class="asset-library-greeting" hidden></div>
<div class="asset-library-controls">
  <div class="asset-library-search">
    <label class="asset-library-visually-hidden" for="asset-library-search">Search downloads</label>
    <input
      id="asset-library-search"
      class="asset-library-search-input"
      type="search"
      placeholder="Search downloads…"
      autocomplete="off"
    />
  </div>
  <div class="asset-library-filters" role="group" aria-label="Filter by category"></div>
</div>
<p class="asset-library-status" role="status" aria-live="polite"></p>
<ul class="asset-library-results"></ul>
<p class="asset-library-empty" hidden>No files match your search.</p>
